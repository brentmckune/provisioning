<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HIPAA Policy Compliance Analyzer{% endblock %}</title>
<style>
  :root {
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    /* status palette — fixed, paired with icon + label, never color alone */
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
    --accent:          #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent:         #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  a { color: var(--accent); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 64px; }
  header.site {
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-1);
  }
  header.site .wrap { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; }
  header.site h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header.site .sub { color: var(--text-muted); font-size: 13px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin: 18px 0;
  }
  h2 { font-size: 16px; margin: 26px 0 10px; }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .secondary { color: var(--text-secondary); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num { font-variant-numeric: tabular-nums; }
  /* status chip: icon + label, color never alone */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chip.good .dot     { background: var(--status-good); }
  .chip.warning .dot  { background: var(--status-warning); }
  .chip.serious .dot  { background: var(--status-serious); }
  .chip.critical .dot { background: var(--status-critical); }
  .chip .glyph { font-size: 12px; color: var(--text-secondary); }
  button, .btn {
    font: inherit; font-weight: 600; font-size: 14px;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .flash { border: 1px solid var(--status-critical); border-radius: 8px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }
  code { background: var(--page); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <h1><a href="{{ url_for('index') }}" style="color:inherit;text-decoration:none">HIPAA Policy Compliance Analyzer</a></h1>
    <span class="sub">Privacy · Security · Breach Notification</span>
  </div>
</header>
<div class="wrap">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">⚠ {{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
